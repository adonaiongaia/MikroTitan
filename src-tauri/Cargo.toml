[package]
name = "janas-studio"
version = "0.2.0"
default-run = "janas-studio"
description = "A dual-inference local AI desktop studio for Janas-LLM and llama.cpp"
authors = ["MikroTitan contributors"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Keep Tauri diagnostics on stderr, but route them through a redacting
# subscriber so an IPC key mismatch is reported without exposing either key.
tauri = { version = "2", features = ["tracing"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "fs", "io-util", "macros", "process", "rt-multi-thread", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2", "multipart"] }
base64 = "0.22"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
libc = "0.2"
shell-words = "1"
urlencoding = "2"
async-trait = "0.1"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
axum = "0.8.4"

# WebKitGTK needs enable-media-stream plus a permission-request handler before
# getUserMedia can open the microphone. Pinned to the exact version wry links so
# both resolve to one webkit2gtk-sys and the AppImage carries one copy.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
